<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Focus Timer</title>
<style>
  :root {
    --bg: #f4f1ea;
    --card: #ffffff;
    --text: #1f2328;
    --muted: #6b6f76;
    --accent: #d9480f;
    --accent-soft: #fde4d6;
    --border: #e4e0d6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c;
      --card: #20232a;
      --text: #eceef1;
      --muted: #9aa0a8;
      --accent: #ff7a45;
      --accent-soft: #3a2a22;
      --border: #2f333b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }
  main { width: 100%; max-width: 440px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: 0.95rem; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 16px;
  }
  .modes { display: flex; gap: 8px; margin-bottom: 20px; }
  .modes button {
    flex: 1;
    padding: 8px 4px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    border-radius: 999px;
    cursor: pointer;
    font-size: 0.85rem;
  }
  .modes button.active {
    background: var(--accent-soft);
    color: var(--accent);
    border-color: var(--accent);
    font-weight: 600;
  }
  .time {
    font-size: 4.5rem;
    font-weight: 700;
    text-align: center;
    font-variant-numeric: tabular-nums;
    letter-spacing: -2px;
    margin: 8px 0;
  }
  .bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-bottom: 20px; }
  .bar div { height: 100%; width: 0; background: var(--accent); transition: width 0.3s linear; }
  .controls { display: flex; gap: 10px; }
  .controls button {
    flex: 1;
    padding: 14px;
    border-radius: 12px;
    border: none;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  #startBtn { background: var(--accent); color: #fff; }
  #resetBtn { background: var(--border); color: var(--text); }
  .stats { text-align: center; color: var(--muted); margin-top: 16px; font-size: 0.9rem; }
  .stats strong { color: var(--text); }
  h2 { font-size: 1rem; margin: 0 0 12px; }
  form { display: flex; gap: 8px; margin-bottom: 12px; }
  input[type=text] {
    flex: 1;
    min-width: 0;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 0.95rem;
  }
  form button {
    padding: 10px 16px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-weight: 600;
    cursor: pointer;
  }
  ul { list-style: none; padding: 0; margin: 0; }
  li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
  }
  li:last-child { border-bottom: none; }
  li span { flex: 1; word-break: break-word; }
  li.done span { text-decoration: line-through; color: var(--muted); }
  li .del {
    border: none;
    background: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 1.1rem;
  }
  .empty { color: var(--muted); font-size: 0.9rem; }
  footer { text-align: center; color: var(--muted); font-size: 0.8rem; margin-top: 8px; }
</style>
</head>
<body>
<main>
  <h1>Focus Timer</h1>
  <p class="sub">A simple Pomodoro timer for study sessions.</p>

  <section class="card">
    <div class="modes">
      <button data-mode="focus" class="active">Focus 25</button>
      <button data-mode="short">Break 5</button>
      <button data-mode="long">Long 15</button>
    </div>
    <div class="time" id="time">25:00</div>
    <div class="bar"><div id="progress"></div></div>
    <div class="controls">
      <button id="startBtn">Start</button>
      <button id="resetBtn">Reset</button>
    </div>
    <p class="stats">Focus sessions completed today: <strong id="count">0</strong></p>
  </section>

  <section class="card">
    <h2>What are you working on?</h2>
    <form id="taskForm">
      <input type="text" id="taskInput" placeholder="e.g. Read chapter 3" maxlength="80">
      <button type="submit">Add</button>
    </form>
    <ul id="taskList"></ul>
  </section>

  <footer>Built for Week 1 · deployed with GitHub Pages</footer>
</main>

<script>
  const MODES = { focus: 25 * 60, short: 5 * 60, long: 15 * 60 };
  let mode = 'focus';
  let remaining = MODES[mode];
  let timer = null;
  let endAt = 0;

  const timeEl = document.getElementById('time');
  const progressEl = document.getElementById('progress');
  const startBtn = document.getElementById('startBtn');
  const countEl = document.getElementById('count');

  // Safe storage helpers (storage can be blocked in some browsers)
  function load(key, fallback) {
    try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
    catch (e) { return fallback; }
  }
  function save(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
  }

  const today = new Date().toDateString();
  let stats = load('focus-stats', { day: today, count: 0 });
  if (stats.day !== today) stats = { day: today, count: 0 };
  countEl.textContent = stats.count;

  function format(sec) {
    const m = Math.floor(sec / 60).toString().padStart(2, '0');
    const s = (sec % 60).toString().padStart(2, '0');
    return m + ':' + s;
  }

  function render() {
    timeEl.textContent = format(remaining);
    document.title = (timer ? format(remaining) + ' · ' : '') + 'Focus Timer';
    const done = 1 - remaining / MODES[mode];
    progressEl.style.width = (done * 100) + '%';
  }

  function beep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      [0, 0.35, 0.7].forEach(t => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.2, ctx.currentTime + t);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 0.25);
        osc.connect(gain).connect(ctx.destination);
        osc.start(ctx.currentTime + t);
        osc.stop(ctx.currentTime + t + 0.3);
      });
    } catch (e) {}
  }

  function tick() {
    remaining = Math.max(0, Math.round((endAt - Date.now()) / 1000));
    render();
    if (remaining === 0) {
      stop();
      beep();
      if (mode === 'focus') {
        stats.count++;
        countEl.textContent = stats.count;
        save('focus-stats', stats);
      }
    }
  }

  function start() {
    if (remaining === 0) remaining = MODES[mode];
    endAt = Date.now() + remaining * 1000;
    timer = setInterval(tick, 250);
    startBtn.textContent = 'Pause';
  }

  function stop() {
    clearInterval(timer);
    timer = null;
    startBtn.textContent = 'Start';
    render();
  }

  startBtn.addEventListener('click', () => (timer ? stop() : start()));
  document.getElementById('resetBtn').addEventListener('click', () => {
    stop();
    remaining = MODES[mode];
    render();
  });

  document.querySelectorAll('.modes button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.modes button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      mode = btn.dataset.mode;
      stop();
      remaining = MODES[mode];
      render();
    });
  });

  // Task list
  let tasks = load('focus-tasks', []);
  const listEl = document.getElementById('taskList');

  function renderTasks() {
    listEl.innerHTML = '';
    if (tasks.length === 0) {
      listEl.innerHTML = '<li class="empty">No tasks yet. Add one above.</li>';
      return;
    }
    tasks.forEach((task, i) => {
      const li = document.createElement('li');
      if (task.done) li.className = 'done';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = task.done;
      cb.addEventListener('change', () => { tasks[i].done = cb.checked; save('focus-tasks', tasks); renderTasks(); });
      const span = document.createElement('span');
      span.textContent = task.text;
      const del = document.createElement('button');
      del.className = 'del';
      del.textContent = '×';
      del.setAttribute('aria-label', 'Delete task');
      del.addEventListener('click', () => { tasks.splice(i, 1); save('focus-tasks', tasks); renderTasks(); });
      li.append(cb, span, del);
      listEl.appendChild(li);
    });
  }

  document.getElementById('taskForm').addEventListener('submit', e => {
    e.preventDefault();
    const input = document.getElementById('taskInput');
    const text = input.value.trim();
    if (!text) return;
    tasks.push({ text, done: false });
    save('focus-tasks', tasks);
    input.value = '';
    renderTasks();
  });

  render();
  renderTasks();
</script>
</body>
</html>
